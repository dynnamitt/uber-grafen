name: pages

# Publishes the browser build to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# Until then the deploy job fails; re-run it after enabling Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # never cut a Pages deploy off midway

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      # Cache the installed Emscripten SDK. Its location is the emsdk package
      # hash; which SDK version gets installed is pinned by raylib (via
      # raylib_zig), so key on both and nothing else in build.zig.zon.
      - name: Emscripten SDK cache key
        id: emsdk
        run: |
          pkg=$(sed -n '/\.emsdk = /,/}/ s/.*\.hash = "\([^"]*\)".*/\1/p' build.zig.zon)
          rl=$(sed -n '/\.raylib_zig = /,/}/ s/.*\.hash = "\([^"]*\)".*/\1/p' build.zig.zon)
          test -n "$pkg" && test -n "$rl"
          echo "path=zig-pkg/$pkg" >> "$GITHUB_OUTPUT"
          echo "key=emsdk-$pkg-$rl" >> "$GITHUB_OUTPUT"

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: ${{ steps.emsdk.outputs.path }}
          key: ${{ steps.emsdk.outputs.key }}

      # Don't publish a main commit whose sim tests fail (headless, no X11 needed).
      - name: Unit tests
        run: zig build test --summary all

      # wasm-ld only warns on a C/Zig extern signature mismatch, then makes the
      # call trap at runtime (zflecs' ecs_set_id did this), so fail on it here.
      - name: Build for the browser
        shell: bash
        run: |
          zig build -Dtarget=wasm32-emscripten -Doptimize=ReleaseSmall --summary all 2>&1 | tee build.log
          if grep -q 'signature mismatch' build.log; then
            echo "::error::wasm-ld function signature mismatch (call traps on web)"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: zig-out/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
