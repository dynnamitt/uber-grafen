name: ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      # raylib's GLFW backend compiles against X11 + GL headers.
      - name: Install X11/GL dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libgl-dev

      - name: Format check
        run: zig fmt --check build.zig build.zig.zon src

      - name: Unit tests (headless)
        run: zig build test --summary all

      - name: Build app
        run: zig build --summary all

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      # The Emscripten SDK is installed into zig-pkg/ by the build itself.
      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: zig-pkg/N-V-__8AAJl1DwBezhYo_VE6f53mPVm00R-Fk28NPW7P14EQ
          key: emsdk-${{ hashFiles('build.zig.zon') }}

      - name: Build for the browser
        run: zig build -Dtarget=wasm32-emscripten -Doptimize=ReleaseSmall --summary all

      - name: Show output
        run: ls -la zig-out/web

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: zig-out/web
